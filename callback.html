  <footer><a href="index.html">← Trivia 24/7</a></footer>

<script>
  var p = new URLSearchParams(location.search);
  if (p.get('error')) document.getElementById('msg').textContent = 'Error: ' + p.get('error') + ' ' + (p.get('error_description') || '');
  else if (!p.get('code')) document.getElementById('msg').textContent = 'Página de retorno de la autorización. No hay nada que hacer aquí.';
</script>
